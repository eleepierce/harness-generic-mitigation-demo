# Real-path follow-up: the #help-observability PrivateLink allowlist request (PR #337,
# telemetry-gateway-iac) is merged and applied, and infra/springer-otel-vpc-endpoint.tf
# is up (vpce-0f015c495a2dea9b9, state=available, real TCP connect to
# otelgw-gp0.us-east-1.dev.platform.twilioinfra.com:443 confirmed from inside this VPC).
# So this now tests real delivery, not just the mechanism: does a log line from a
# short-lived, run-to-completion pod actually land in Springer/ClickHouse, not just get
# captured locally by the collector? otlp/springer exporter added alongside debug so
# results are visible both via `kubectl logs` (immediate) and in ClickHouse (real
# end-to-end proof). Original mechanism-only finding (4/4 captured via debug exporter,
# no real Springer connectivity) is unchanged and documented below/in README.

mode: daemonset

image:
  repository: otel/opentelemetry-collector-contrib

presets:
  logsCollection:
    enabled: true
    includeCollectorLogs: false
  # Adds the k8s_attributes processor AND the ClusterRole/binding it needs to read
  # pods from the API server. Using the preset rather than hand-writing the
  # processor is what gets the RBAC right; the extract config below is merged
  # over whatever the preset sets.
  kubernetesAttributes:
    enabled: true

config:
  processors:
    # Measured 2026-09-23: every log line this collector shipped arrived with
    # ServiceName='unknown_service', ClusterName='unknown' and AccountID='unknown',
    # because the only resource attributes present were k8s.container.name,
    # k8s.container.restart_count, k8s.namespace.name, k8s.pod.name, k8s.pod.uid
    # and service.name. There was no k8s.cluster.name and no cloud.account.id at
    # all, so CND log lines could not be filtered by cluster or account -- they
    # were findable only by pod name or body text, and indistinguishable from any
    # other un-attributed sender in a shared ClickHouse table.
    k8s_attributes:
      extract:
        # NOTE: deliberately no `metadata:` list here. Setting one REPLACES the
        # preset's defaults rather than adding to them. An earlier revision of
        # this file listed six fields and thereby dropped seventeen, including
        # service.namespace, service.version, service.instance.id, the workload
        # names (replicaset/daemonset/job/cronjob/statefulset), container.image.*,
        # k8s.cluster.uid -- and, worst, `service.name` itself, which the preset
        # derives from k8s semconv. That would have left every pod WITHOUT the
        # annotation below reporting unknown_service: the exact bug this file
        # exists to fix, reintroduced for un-annotated pods. Verified against
        # `helm template` output for chart 0.165.0 before changing it.
        annotations:
          # Deliberately the SAME annotation OTK's node-agent keys off, so a pod
          # names its service identically on both platforms and one query shape
          # works across them.
          #
          # Belt and braces: the preset also sets `otel_annotations: true`, which
          # makes k8s_attributes honour `resource.opentelemetry.io/*` natively, so
          # this block is probably redundant. It is kept because it states the
          # cross-platform contract explicitly -- if a future chart bump flips
          # that default off, parity should not break silently.
          - key: resource.opentelemetry.io/service.name
            tag_name: service.name
            from: pod
    # cloud.account.id / cloud.region / host.id from IMDS. Needs no extra IAM.
    resourcedetection/aws:
      detectors: [env, ec2]
      timeout: 5s
      override: false
    # The ec2 detector cannot supply the EKS cluster name, and the eks detector's
    # coverage for it varies by collector version, so set it explicitly rather
    # than depend on detection. Update this if the values file is reused for
    # another cluster.
    resource/cluster:
      attributes:
        - key: k8s.cluster.name
          value: harness-poc
          action: upsert
  exporters:
    debug:
      verbosity: detailed
    otlp/springer:
      endpoint: otelgw-gp0.us-east-1.dev.platform.twilioinfra.com:443
  service:
    pipelines:
      logs:
        # Listed in full because an explicit list REPLACES the chart's merged
        # default rather than appending to it -- omitting memory_limiter/batch
        # here would silently drop them.
        processors: [memory_limiter, k8s_attributes, resourcedetection/aws, resource/cluster, batch]
        exporters: [debug, otlp/springer]

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
