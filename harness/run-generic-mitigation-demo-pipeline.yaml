pipeline:
  name: run-generic-mitigation-demo
  identifier: rungenericmitigationdemo
  projectIdentifier: reliability_engineering
  orgIdentifier: cloudnativeplatform
  tags: {}
  stages:
    - stage:
        name: mitigation
        identifier: mitigation
        template:
          templateRef: rungenericmitigation
          versionLabel: 2.1.0
          templateInputs:
            type: Custom
            variables:
              - name: image
                type: String
                value: <+input>
              - name: image_fully_qualified
                type: String
                value: <+input>
              - name: docker_connector
                type: String
                value: <+input>
              - name: k8s_connector
                type: String
                value: <+input>
              - name: env_json
                type: String
                value: <+input>
                # Caller (e.g. domain-manifest-fanout-orchestrator.sh) constructs this, e.g.:
                # {"TARGET_HOST": "...", "TARGET_PORT": "3306", "DB_USER": "admin",
                #  "DB_PASSWORD": "__MITIGATION_SECRET__"}
              - name: secret_identifier
                type: String
                value: <+input>
                # e.g. harnessPocDbPasswordV2
              - name: verifier_image
                type: String
                value: <+input>
              - name: verifier_connector
                type: String
                value: <+input>
              - name: environment
                type: String
                value: <+input>
                # dev|stage|prod - prod runs are gated on ticket_id
              - name: ticket_id
                type: String
                value: <+input>
                # Required only for environment=prod; leave empty for dev/stage
