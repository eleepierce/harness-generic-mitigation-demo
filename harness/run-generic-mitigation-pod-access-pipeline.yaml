pipeline:
  name: run-generic-mitigation-pod-access
  identifier: rungenericmitigationpodaccess
  projectIdentifier: reliability_engineering
  orgIdentifier: cloudnativeplatform
  tags: {}
  stages:
    - stage:
        name: mitigation
        identifier: mitigation
        template:
          templateRef: rungenericmitigation
          versionLabel: "2.0.0"
          templateInputs:
            type: Custom
            variables:
              - name: image
                type: String
                value: <+input>
              - name: docker_connector
                type: String
                value: <+input>
              - name: k8s_connector
                type: String
                value: <+input>
              - name: env_json
                type: String
                value: <+input>
              - name: secret_identifier
                type: String
                value: <+input>
                # No real secret needed for this mitigation - pass a harmless existing
                # identifier (its value is never referenced since env_json contains no
                # __MITIGATION_SECRET__ placeholder). e.g. ecrTokenFromSecretsManager
                # e.g. {"TARGET_POD": "pod-access-target", "TARGET_NAMESPACE": "default"}
                # Fan-out across multiple pods is now domain-manifest-fanout-orchestrator.sh's
                # job (one trigger per cell/pod), superseding this pipeline's old built-in
                # strategy: repeat over a hardcoded 3-pod list.
