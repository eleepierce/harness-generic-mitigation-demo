pipeline:
  name: verification-test
  identifier: verificationtest
  projectIdentifier: reliability_engineering
  orgIdentifier: cloudnativeplatform
  tags: {}
  stages:
    - stage:
        name: test-verification
        identifier: test_verification
        description: "Test cosign verification - PLATSRE-1652"
        template:
          templateRef: rungenericmitigation
          versionLabel: "1.1.0"
          templateInputs:
            type: Custom
            variables:
              - name: image
                type: String
                value: <+input>.default(alpine:latest).allowedValues(alpine:latest,busybox:latest,registry.twilio.com/generic-mitigation-scripts/admin-verifier:latest)
              - name: target_host
                type: String
                value: <+input>.default(localhost)
              - name: target_port
                type: String
                value: <+input>.default(3306)
              - name: docker_connector
                type: String
                value: <+input>.default(harnesspocdockerecr)
              - name: k8s_connector
                type: String
                value: <+input>.default(harnesspoceks)
              - name: db_user
                type: String
                value: <+input>.default(testuser)
              - name: db_password_secret
                type: String
                value: <+input>.default(harnessPocDbPasswordV2)
              - name: cosign_public_key
                type: String
                value: <+input>
                description: "Paste the full PEM-encoded public key here"
              - name: verifier_image
                type: String
                value: <+input>.default(alpine/cosign:latest)
              - name: verifier_connector
                type: String
                value: <+input>.default(harnesspocdockerecr)
              - name: environment
                type: String
                value: <+input>.default(prod).allowedValues(dev,prod)
