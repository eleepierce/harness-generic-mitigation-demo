pipeline:
  name: verification-test
  identifier: verificationtest
  projectIdentifier: reliability_engineering
  orgIdentifier: cloudnativeplatform
  tags: {}
  stages:
    - stage:
        name: test-verification
        identifier: test_verification
        description: Test cosign verification - PLATSRE-1652
        template:
          templateRef: rungenericmitigation
          versionLabel: 2.0.0
          templateInputs:
            type: Custom
            variables:
              # image / docker_connector drive the Run Mitigation Container step ONLY.
              # It runs the image's ENTRYPOINT (no command override), so Harness must
              # resolve the entrypoint from the manifest -- and that resolver ignores the
              # connector's registry URL, parsing the image string with Docker defaults:
              #   dotted first component (github.com/...) -> that literal host   -> 404
              #   bare ref        (harness-poc/...)       -> docker.io           -> 401
              # Only a FULLY-QUALIFIED ECR ref works (resolver hits the real host, and the
              # connector supplies matching creds) -- same reason the verify steps use
              # image_fully_qualified. Use the POC's connectivity-check (network-test)
              # image at its real 547641909728 ECR host, with the harness-poc ECR connector.
              # Mitigation image must be v2.0.0-compatible: it needs the mitigation-entrypoint.sh
              # wrapper that decodes MITIGATION_ENV_JSON into real env vars. The legacy
              # connectivity-check:v1.0.4 lacks that wrapper (reads TARGET_HOST directly), so it
              # errored "Required env vars not set". redis-check:v1.0.0 (built from
              # container-redis-check/, pushed to the POC ECR) HAS the wrapper and pairs with the
              # POC's deployed redis-target backend for a real SET/GET round-trip -> exits 0.
              # No .allowedValues() (a long dotted ECR host there broke plan creation).
              - name: image
                type: String
                value: <+input>.default(547641909728.dkr.ecr.us-east-1.amazonaws.com/harness-poc/redis-check:v1.0.0)
              - name: image_fully_qualified
                type: String
                value: <+input>.default(018537234677.dkr.ecr.us-east-1.amazonaws.com/github.com/twilio-internal/generic-mitigation-scripts/admin-verifier:1.4.2)
              - name: docker_connector
                type: String
                value: <+input>.default(harnesspocdockerecr)
              - name: k8s_connector
                type: String
                value: <+input>.default(harnesspoceks)
              # Keys inside MITIGATION_ENV_JSON are whatever the chosen mitigation's check
              # script reads; the wrapper exports them verbatim. redis-check reads REDIS_HOST/
              # REDIS_PORT. Target the POC's deployed redis-target (same host the standalone
              # redis-reachability-test pipeline uses) so the SET/GET round-trip succeeds.
              - name: env_json
                type: String
                value: <+input>.default({"REDIS_HOST":"redis-target.default.svc.cluster.local","REDIS_PORT":"6379"})
              - name: secret_identifier
                type: String
                value: <+input>.default(harnessPocDbPasswordV2)
              - name: verifier_image
                type: String
                value: <+input>.default(github.com/twilio-internal/generic-mitigation-scripts/admin-verifier:1.4.2)
              - name: verifier_connector
                type: String
                value: <+input>.default(otkEcrBroker)
              - name: environment
                type: String
                value: <+input>.default(prod).allowedValues(dev,prod)
