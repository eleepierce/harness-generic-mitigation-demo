pipeline:
  name: verification-test
  identifier: verificationtest
  projectIdentifier: reliability_engineering
  orgIdentifier: cloudnativeplatform
  tags: {}
  stages:
    - stage:
        name: test-verification
        identifier: test_verification
        description: Test cosign verification - PLATSRE-1652
        template:
          templateRef: rungenericmitigation
          versionLabel: 2.0.0
          templateInputs:
            type: Custom
            variables:
              - name: image
                type: String
                value: <+input>.default(alpine:latest).allowedValues(alpine:latest,busybox:latest,github.com/twilio-internal/generic-mitigation-scripts/admin-verifier:1.4.1)
              - name: docker_connector
                type: String
                value: <+input>.default(otkEcrBroker)
              - name: k8s_connector
                type: String
                value: <+input>.default(harnesspoceks)
              - name: env_json
                type: String
                value: <+input>.default({"TARGET_HOST":"localhost","TARGET_PORT":"3306"})
              - name: secret_identifier
                type: String
                value: <+input>.default(harnessPocDbPasswordV2)
              - name: cosign_public_key
                type: String
                value: <+input>
              - name: verifier_image
                type: String
                value: <+input>.default(github.com/twilio-internal/generic-mitigation-scripts/admin-verifier:1.4.1)
              - name: verifier_connector
                type: String
                value: <+input>.default(otkEcrBroker)
              - name: environment
                type: String
                value: <+input>.default(prod).allowedValues(dev,prod)
