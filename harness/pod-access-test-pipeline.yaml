pipeline:
  name: harness-poc-pod-access-test
  identifier: harnesspocpodaccesstest
  projectIdentifier: reliability_engineering
  orgIdentifier: cloudnativeplatform
  tags: {}
  stages:
    - stage:
        name: pod-access-test
        identifier: podaccesstest
        description: Tests whether a Harness-orchestrated container can reach into a separate, already-running pod (kubectl exec) and retrieve a file - answers Robert's question about pod-level access, not just DB/host reachability. Extended with a repeat strategy to fan the same mitigation out across multiple pods in one pipeline execution - a mechanical proxy for "run one mitigation across a fleet of cells" from the 08-04 cellularization discussion.
        type: Custom
        spec:
          execution:
            steps:
              - stepGroup:
                  name: pod-access-test
                  identifier: podaccesstestgroup
                  steps:
                    - step:
                        type: Run
                        name: Retrieve File From Target Pod
                        identifier: Retrieve_File_From_Target_Pod
                        timeout: 5m
                        spec:
                          connectorRef: harnesspocdockerecr
                          image: 547641909728.dkr.ecr.us-east-1.amazonaws.com/harness-poc/pod-access-check:v1.0.0
                          shell: Sh
                          envVariables:
                            TARGET_POD: <+repeat.item>
                            TARGET_NAMESPACE: default
                  stepGroupInfra:
                    type: KubernetesDirect
                    spec:
                      connectorRef: harnesspoceks
                      namespace: default
        tags: {}
        strategy:
          repeat:
            items:
              - pod-access-target
              - pod-access-target-2
              - pod-access-target-3
            maxConcurrency: 3
