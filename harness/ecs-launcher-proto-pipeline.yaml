pipeline:
  name: ecs-launcher-proto
  identifier: ecslauncherproto
  projectIdentifier: reliability_engineering_domain
  orgIdentifier: cloudnativeplatform
  tags:
    owner: eleepierce
    ticket: PLATSRE-1296
    restored_from: reliability_engineering
  description: >-
    Verifies the image's cosign signature (fail closed) and launches the verified digest. Parameterised: one pipeline launches any harness-poc mitigation by name, each under its own
    narrow task role (PLATSRE-1296). Self-contained replacement for DO's org.run_ecs_container_stepgroup. Launches a short-lived
    ECS Fargate mitigation task from a Kubernetes container Run step using only the AWS CLI, so it
    does not depend on /opt/harness-delegate/client-tools/harness-lib.sh (absent on a
    self-installed delegate). Also uses a STABLE CloudWatch log group that is never deleted, so
    CloudWatch -> Springer forwarding can actually work.
  stages:
    - stage:
        name: ecs-launcher
        identifier: ecslauncher
        type: Custom
        tags: {}
        spec:
          execution:
            steps:
              - stepGroup:
                  name: ecs-launcher
                  identifier: ecslaunchergroup
                  stepGroupInfra:
                    type: KubernetesDirect
                    spec:
                      connectorRef: harnesspoceks
                      namespace: default
                  steps:
                    - step:
                        type: Run
                        name: Verify Image Signature
                        identifier: Verify_Image_Signature
                        timeout: 2m
                        # Fail closed: if this step fails the launch step never runs and no ECS task is created.
                        # Read-only, so safe to retry on transient errors (same policy as the K8s template).
                        failureStrategies:
                          - onFailure:
                              errors:
                                - Unknown
                                - Connectivity
                                - Timeout
                              action:
                                type: Retry
                                spec:
                                  retryCount: 3
                                  retryIntervals:
                                    - 30s
                                    - 1m
                                    - 2m
                                  onRetryFailure:
                                    action:
                                      type: MarkAsFailure
                        spec:
                          connectorRef: otkEcrBroker
                          image: github.com/twilio-internal/generic-mitigation-scripts/admin-verifier:1.4.2
                          shell: Sh
                          command: |-
                            set -euo pipefail
                            MITIGATION_NAME='<+pipeline.variables.mitigation_name>'
                            IMAGE_TAG='<+pipeline.variables.image_tag>'
                            TRUST_ANCHOR='<+pipeline.variables.trust_anchor>'
                            case "$MITIGATION_NAME" in
                              ''|*[!a-z0-9-]*|-*) echo "FATAL: invalid mitigation_name '$MITIGATION_NAME'"; exit 1;;
                            esac
                            IMAGE="547641909728.dkr.ecr.us-east-1.amazonaws.com/harness-poc/$MITIGATION_NAME:$IMAGE_TAG"
                            echo "Verifying image signature: $IMAGE"

                            # cosign uses its own keychain, so register the ECR credential helper for this
                            # registry host (it takes the pod's node-role credentials), as the K8s template does.
                            REGISTRY_HOST=$(echo "$IMAGE" | cut -d/ -f1)
                            export DOCKER_CONFIG=/tmp/.docker
                            mkdir -p "$DOCKER_CONFIG"
                            printf '{"credHelpers":{"%s":"ecr-login"}}' "$REGISTRY_HOST" > "$DOCKER_CONFIG/config.json"

                            # Trust anchor. production = the KMS public key baked into the verifier image (the real
                            # trust anchor). sandbox = the public half of this account's own KMS key
                            # alias/harness-poc-cosign, because sandbox images are not signed by the production key.
                            case "$TRUST_ANCHOR" in
                              production) KEYFILE=/usr/local/share/cosign-public.key;;
                              sandbox)
                                KEYFILE=/tmp/sandbox-cosign.pub
                                cat > "$KEYFILE" <<'PUBKEY'
                            -----BEGIN PUBLIC KEY-----
                            MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEuRXoJdUuaVjn3BGO29X+Sb79icjD
                            2W41voxmQVt8qgPUPMLbK36dzGXt7/bZri6OvQpmuuiFpfhH1b4i3mugdQ==
                            -----END PUBLIC KEY-----
                            PUBKEY
                                ;;
                              *) echo "FATAL: trust_anchor must be production or sandbox (got '$TRUST_ANCHOR')"; exit 1;;
                            esac
                            echo "trust anchor: $TRUST_ANCHOR ($KEYFILE)"

                            cosign verify --insecure-ignore-tlog --key "$KEYFILE" "$IMAGE" > /tmp/verify.json
                            DIGEST=$(jq -r '.[0].critical.image."docker-manifest-digest"' /tmp/verify.json)
                            case "$DIGEST" in
                              sha256:????????????????????????????????????????????????????????????????) ;;
                              *) echo "FATAL: signature verified but no manifest digest could be read from the cosign output"; exit 1;;
                            esac
                            echo "signature verified; digest=$DIGEST"
                            IMAGE_DIGEST="$DIGEST"
                          outputVariables:
                            - name: IMAGE_DIGEST
                              type: String
                              value: IMAGE_DIGEST
                    - step:
                        type: Run
                        name: Launch ECS Mitigation Task
                        identifier: Launch_ECS_Mitigation_Task
                        timeout: 15m
                        spec:
                          connectorRef: otkEcrBroker
                          image: 018537234677.dkr.ecr.us-east-1.amazonaws.com/docker.io/amazon/aws-cli:2.13.33
                          shell: Sh
                          envVariables:
                            AWS_REGION: us-east-1
                            AWS_DEFAULT_REGION: us-east-1
                          command: |-
                            # ------------------------------------------------------------------
                            # Self-contained ECS Fargate mitigation launcher.
                            # Replaces DO's org.run_ecs_container_stepgroup (which sources
                            # /opt/harness-delegate/client-tools/harness-lib.sh - not present on a
                            # self-installed delegate). Pure AWS CLI, no jq, no delegate libs.
                            # ------------------------------------------------------------------
                            set -u

                            REGION=us-east-1
                            CLUSTER=harness-poc-mitigation
                            MITIGATION_NAME='<+pipeline.variables.mitigation_name>'
                            IMAGE_TAG='<+pipeline.variables.image_tag>'
                            ENV_JSON='<+pipeline.variables.env_json>'
                            MITIGATION_TICKET='<+pipeline.variables.mitigation_ticket_id>'
                            MITIGATION_ENV='<+pipeline.variables.mitigation_environment>'
                            MITIGATION_ROLE_LABEL='<+pipeline.variables.mitigation_target_role>'
                            CONTAINER_NAME=mitigation
                            SUBNETS=subnet-0e03fe41c740515df,subnet-0a53a43b9278b1b7b
                            SECURITY_GROUP=sg-04ac82eeae54cd226
                            # STABLE log group, deliberately never deleted: /ecs/<cluster>/<service>
                            # shape matches the Springer gateway log-group regex, and it persists so
                            # CloudWatch -> Springer forwarding is actually possible. DO's version
                            # uses a per-run ephemeral group and deletes it, which makes that
                            # impossible.
                            LOG_RETENTION_DAYS=1
                            STREAM_PREFIX=ecs
                            FAIL_MODE=<+pipeline.variables.fail_mode>
                            POLL_INTERVAL=10
                            POLL_MAX_SECONDS=300
                            LOG_WAIT_MAX_SECONDS=90

                            TASK_DEF_ARN=""
                            TASK_ARN=""

                            log() { echo "[ecs-launcher] $*"; }

                            # ---------- derive everything from the mitigation name ----------
                            # One name selects the ECR repo, the task family, the log group AND the task role, so a
                            # caller cannot pair one mitigation's image with another's role. The role is never a free
                            # input; the launcher's iam:PassRole is limited to role/harness-poc-mitigation-* so IAM
                            # enforces the same boundary even if this check were bypassed.
                            case "$MITIGATION_NAME" in
                              ''|*[!a-z0-9-]*|-*) echo "[ecs-launcher] FATAL: mitigation_name must be lowercase letters, digits and hyphens, not starting with a hyphen (got: '$MITIGATION_NAME')"; exit 1;;
                            esac
                            FAMILY="harness-poc-$MITIGATION_NAME"
                            # Launch the exact digest the Verify Image Signature step verified, not the tag, so the
                            # image cannot change between verification and the ECS pull.
                            IMAGE_DIGEST='<+execution.steps.ecslaunchergroup.steps.Verify_Image_Signature.output.outputVariables.IMAGE_DIGEST>'
                            case "$IMAGE_DIGEST" in
                              sha256:????????????????????????????????????????????????????????????????) ;;
                              *) echo "[ecs-launcher] FATAL: no verified image digest from the verify step (got '$IMAGE_DIGEST')"; exit 1;;
                            esac
                            IMAGE="547641909728.dkr.ecr.us-east-1.amazonaws.com/harness-poc/$MITIGATION_NAME@$IMAGE_DIGEST"
                            EXEC_ROLE_ARN=arn:aws:iam::547641909728:role/harness-poc-mitigation-exec
                            TASK_ROLE_ARN="arn:aws:iam::547641909728:role/harness-poc-mitigation-$MITIGATION_NAME"
                            LOG_GROUP="/ecs/harness-poc-mitigation/$MITIGATION_NAME"
                            log "mitigation=$MITIGATION_NAME image=$IMAGE"
                            log "execution role: $EXEC_ROLE_ARN"
                            log "task role:      $TASK_ROLE_ARN"

                            cleanup() {
                              if [ -n "$TASK_DEF_ARN" ]; then
                                log "deregistering task definition $TASK_DEF_ARN"
                                aws ecs deregister-task-definition \
                                  --region "$REGION" \
                                  --task-definition "$TASK_DEF_ARN" \
                                  --query 'taskDefinition.status' --output text \
                                  || log "WARN: deregister failed (non-fatal)"
                              fi
                              log "log group $LOG_GROUP intentionally NOT deleted"
                            }

                            die() {
                              log "FATAL: $*"
                              cleanup
                              exit 1
                            }

                            log "aws cli: $(aws --version 2>&1)"
                            log "caller identity:"
                            aws sts get-caller-identity --region "$REGION" --output text \
                              || die "no usable AWS credentials in this pod"

                            # ---------- 1. stable log group + retention ----------
                            log "ensuring log group $LOG_GROUP"
                            EXISTING=$(aws logs describe-log-groups \
                              --region "$REGION" \
                              --log-group-name-prefix "$LOG_GROUP" \
                              --query "logGroups[?logGroupName=='$LOG_GROUP'].logGroupName | [0]" \
                              --output text 2>/dev/null)
                            if [ "$EXISTING" = "$LOG_GROUP" ]; then
                              log "log group already exists (reused, not recreated)"
                            else
                              aws logs create-log-group --region "$REGION" --log-group-name "$LOG_GROUP" \
                                || die "could not create log group $LOG_GROUP"
                              log "log group created"
                            fi
                            aws logs put-retention-policy \
                              --region "$REGION" \
                              --log-group-name "$LOG_GROUP" \
                              --retention-in-days "$LOG_RETENTION_DAYS" \
                              || die "could not set retention on $LOG_GROUP"
                            log "retention set to $LOG_RETENTION_DAYS day(s)"

                            # ---------- 2. register task definition ----------
                            # Container contract: ENTRYPOINT is baked into the image
                            # (mitigation-entrypoint.sh -> redis-check.sh). Deliberately no
                            # entryPoint and no command override - config travels only as env vars.
                            ENV_B64=$(printf '%s' "$ENV_JSON" | base64 | tr -d '\n')
                            log "MITIGATION_ENV_JSON_B64=$ENV_B64"

                            cat > /tmp/taskdef.json <<TASKDEF
                            {
                              "family": "$FAMILY",
                              "networkMode": "awsvpc",
                              "requiresCompatibilities": ["FARGATE"],
                              "cpu": "512",
                              "memory": "1024",
                              "executionRoleArn": "$EXEC_ROLE_ARN",
                              "taskRoleArn": "$TASK_ROLE_ARN",
                              "containerDefinitions": [
                                {
                                  "name": "$CONTAINER_NAME",
                                  "image": "$IMAGE",
                                  "essential": true,
                                  "environment": [
                                    {"name": "MITIGATION_ENV_JSON_B64", "value": "$ENV_B64"},
                                    {"name": "MITIGATION_TICKET_ID", "value": "$MITIGATION_TICKET"},
                                    {"name": "MITIGATION_ENVIRONMENT", "value": "$MITIGATION_ENV"},
                                    {"name": "MITIGATION_TARGET_ROLE", "value": "$MITIGATION_ROLE_LABEL"}
                                  ],
                                  "logConfiguration": {
                                    "logDriver": "awslogs",
                                    "options": {
                                      "awslogs-group": "$LOG_GROUP",
                                      "awslogs-region": "$REGION",
                                      "awslogs-stream-prefix": "$STREAM_PREFIX"
                                    }
                                  }
                                }
                              ]
                            }
                            TASKDEF

                            log "registering task definition for family $FAMILY"
                            TASK_DEF_ARN=$(aws ecs register-task-definition \
                              --region "$REGION" \
                              --cli-input-json file:///tmp/taskdef.json \
                              --query 'taskDefinition.taskDefinitionArn' --output text)
                            if [ -z "$TASK_DEF_ARN" ] || [ "$TASK_DEF_ARN" = "None" ]; then
                              TASK_DEF_ARN=""
                              die "register-task-definition returned no ARN"
                            fi
                            log "registered $TASK_DEF_ARN"

                            # ---------- 3. run-task ----------
                            log "running task on cluster $CLUSTER"
                            aws ecs run-task \
                              --region "$REGION" \
                              --cluster "$CLUSTER" \
                              --task-definition "$TASK_DEF_ARN" \
                              --launch-type FARGATE \
                              --count 1 \
                              --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUP],assignPublicIp=DISABLED}" \
                              --output json > /tmp/runtask.json 2> /tmp/runtask.err
                            if [ $? -ne 0 ]; then
                              log "run-task stderr:"
                              cat /tmp/runtask.err
                              die "run-task call failed"
                            fi

                            # No jq in this image, and JMESPath --query only applies to live API
                            # responses, so extract the ARN from the saved JSON with grep/sed.
                            TASK_ARN=$(grep -o '"taskArn"[[:space:]]*:[[:space:]]*"[^"]*"' /tmp/runtask.json \
                              | head -1 | sed 's/.*"\(arn:[^"]*\)"[[:space:]]*$/\1/')
                            if [ -z "$TASK_ARN" ]; then
                              log "run-task response:"
                              cat /tmp/runtask.json
                              die "could not determine task ARN (check failures[] above)"
                            fi
                            TASK_ID=$(basename "$TASK_ARN")
                            log "task ARN: $TASK_ARN"
                            log "task id:  $TASK_ID"

                            # ---------- 4. bounded poll until STOPPED ----------
                            log "polling describe-tasks until STOPPED (max ${POLL_MAX_SECONDS}s)"
                            WAITED=0
                            LAST_STATUS=""
                            until [ "$LAST_STATUS" = "STOPPED" ] || [ "$WAITED" -ge "$POLL_MAX_SECONDS" ]; do
                              sleep "$POLL_INTERVAL"
                              WAITED=$((WAITED + POLL_INTERVAL))
                              LAST_STATUS=$(aws ecs describe-tasks \
                                --region "$REGION" --cluster "$CLUSTER" --tasks "$TASK_ARN" \
                                --query 'tasks[0].lastStatus' --output text 2>/dev/null)
                              log "  t=${WAITED}s lastStatus=$LAST_STATUS"
                            done

                            if [ "$LAST_STATUS" != "STOPPED" ]; then
                              log "stopping runaway task"
                              aws ecs stop-task --region "$REGION" --cluster "$CLUSTER" --task "$TASK_ARN" \
                                --reason "harness step poll timeout" --query 'task.taskArn' --output text \
                                || log "WARN: stop-task failed"
                              die "task did not reach STOPPED within ${POLL_MAX_SECONDS}s (last=$LAST_STATUS)"
                            fi

                            STOPPED_REASON=$(aws ecs describe-tasks \
                              --region "$REGION" --cluster "$CLUSTER" --tasks "$TASK_ARN" \
                              --query 'tasks[0].stoppedReason' --output text 2>/dev/null)
                            log "task STOPPED; stoppedReason=$STOPPED_REASON"

                            # ---------- 5. fetch container logs ----------
                            LOG_STREAM="$STREAM_PREFIX/$CONTAINER_NAME/$TASK_ID"
                            log "fetching CloudWatch logs from $LOG_GROUP :: $LOG_STREAM"
                            LOG_WAITED=0
                            LOG_LINES=""
                            until [ -n "$LOG_LINES" ] || [ "$LOG_WAITED" -ge "$LOG_WAIT_MAX_SECONDS" ]; do
                              LOG_LINES=$(aws logs get-log-events \
                                --region "$REGION" \
                                --log-group-name "$LOG_GROUP" \
                                --log-stream-name "$LOG_STREAM" \
                                --start-from-head \
                                --query 'events[*].[message]' --output text 2>/dev/null)
                              if [ -n "$LOG_LINES" ]; then break; fi
                              sleep 10
                              LOG_WAITED=$((LOG_WAITED + 10))
                              log "  waiting for log delivery (${LOG_WAITED}s)"
                            done

                            echo "=================== CONTAINER STDOUT BEGIN ==================="
                            if [ -n "$LOG_LINES" ]; then
                              echo "$LOG_LINES"
                            else
                              echo "(no log events found in $LOG_GROUP :: $LOG_STREAM)"
                            fi
                            echo "==================== CONTAINER STDOUT END ===================="

                            # ---------- 6. exit code + FAIL_MODE ----------
                            EXIT_CODE=$(aws ecs describe-tasks \
                              --region "$REGION" --cluster "$CLUSTER" --tasks "$TASK_ARN" \
                              --query "tasks[0].containers[?name=='$CONTAINER_NAME'].exitCode | [0]" \
                              --output text 2>/dev/null)
                            log "container '$CONTAINER_NAME' exitCode=$EXIT_CODE"

                            # ---------- 7. deregister task def, keep log group ----------
                            cleanup

                            log "SUMMARY task=$TASK_ID exit_code=$EXIT_CODE fail_mode=$FAIL_MODE log_group=$LOG_GROUP log_stream=$LOG_STREAM"

                            if [ "$EXIT_CODE" = "0" ]; then
                              log "RESULT: container exit code 0 -> step PASSES"
                              exit 0
                            fi
                            if [ "$EXIT_CODE" = "None" ] || [ -z "$EXIT_CODE" ]; then
                              log "RESULT: no container exit code reported (treated as failure)"
                              EXIT_CODE="unknown"
                            fi
                            if [ "$FAIL_MODE" = "OPEN" ]; then
                              log "RESULT: FAIL_MODE=OPEN -> container exit code $EXIT_CODE reported but step PASSES"
                              exit 0
                            fi
                            log "RESULT: FAIL_MODE=CLOSE and container exit code $EXIT_CODE != 0 -> step FAILS (this is the correct, intended propagation)"
                            exit 1
        failureStrategies: []
  variables:
    - name: mitigation_name
      type: String
      description: >-
        Which mitigation to run: redis-check, zk-check or es-check. Selects the ECR repo
        harness-poc/<name>, the task family, the log group and the task role
        harness-poc-mitigation-<name>.
      required: true
      value: <+input>
    - name: image_tag
      type: String
      description: Image tag within harness-poc/<mitigation_name>.
      required: false
      value: <+input>.default(v2.2.0)
    - name: env_json
      type: String
      description: >-
        JSON object of the mitigation's own env vars, e.g. {"REDIS_HOST":"10.0.0.1","REDIS_PORT":"6379"}.
        No single quotes. Fargate cannot resolve cluster-local service names; use an IP or DNS name
        reachable from the workload VPC.
      required: true
      value: <+input>
    - name: mitigation_ticket_id
      type: String
      required: false
      value: <+input>.default(PLATSRE-1796)
    - name: mitigation_environment
      type: String
      required: false
      value: <+input>.default(prod)
    - name: mitigation_target_role
      type: String
      required: false
      value: <+input>.default(crontroller-tx)
    - name: trust_anchor
      type: String
      description: >-
        Which cosign public key the Verify Image Signature step trusts. sandbox = this account's own KMS key
        alias/harness-poc-cosign (the only key that signs the harness-poc images). production = the KMS key
        baked into the admin-verifier image, which is what a real deployment would use.
      required: false
      value: <+input>.default(sandbox)
    - name: fail_mode
      type: String
      description: >-
        CLOSE (default) = the step fails when the mitigation container's exit code is non-zero,
        i.e. the container's result is propagated to the pipeline. OPEN = the exit code is
        reported but the step still passes. Mirrors DO's FAIL_MODE knob.
      required: false
      value: <+input>.default(CLOSE)
