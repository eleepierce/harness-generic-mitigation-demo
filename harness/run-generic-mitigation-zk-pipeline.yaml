pipeline:
  name: run-generic-mitigation-zk
  identifier: rungenericmitigationzk
  projectIdentifier: reliability_engineering
  orgIdentifier: cloudnativeplatform
  tags: {}
  stages:
    - stage:
        name: mitigation
        identifier: mitigation
        template:
          templateRef: rungenericmitigation
          versionLabel: "2.0.0"
          templateInputs:
            type: Custom
            variables:
              - name: image
                type: String
                value: <+input>
              - name: docker_connector
                type: String
                value: <+input>
              - name: k8s_connector
                type: String
                value: <+input>
              - name: env_json
                type: String
                value: <+input>
              - name: secret_identifier
                type: String
                value: <+input>
                # No real secret needed for this mitigation - pass a harmless existing
                # identifier (its value is never referenced since env_json contains no
                # __MITIGATION_SECRET__ placeholder). e.g. ecrTokenFromSecretsManager
                # e.g. {"ZK_HOST": "zk-target.default.svc.cluster.local", "ZK_PORT": "2181"}
