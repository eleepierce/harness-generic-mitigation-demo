template:
  name: run-generic-mitigation
  identifier: rungenericmitigation
  versionLabel: "2.0.0"
  type: Stage
  projectIdentifier: reliability_engineering
  orgIdentifier: cloudnativeplatform
  tags: {}
  spec:
    type: Custom
    spec:
      execution:
        steps:
          - stepGroup:
              name: mitigation
              identifier: mitigation
              steps:
                - step:
                    type: Run
                    name: Run Mitigation Container
                    identifier: Run_Mitigation_Container
                    timeout: 5m
                    spec:
                      connectorRef: <+stage.variables.docker_connector>
                      image: <+stage.variables.image>
                      shell: Sh
                      envVariables:
                        MITIGATION_ENV_JSON: <+stage.variables.env_json>
                        MITIGATION_SECRET_VALUE: <+secrets.getValue(<+stage.variables.secret_identifier>)>
              stepGroupInfra:
                type: KubernetesDirect
                spec:
                  connectorRef: <+stage.variables.k8s_connector>
                  namespace: default
    variables:
      - name: image
        type: String
        description: "Full image reference for the blessed mitigation container"
        required: true
        value: <+input>
      - name: docker_connector
        type: String
        description: "Identifier of the team's DockerRegistry connector for the mitigation image"
        required: true
        value: <+input>
      - name: k8s_connector
        type: String
        description: "Identifier of the team's K8sCluster connector (their delegate/cluster)"
        required: true
        value: <+input>
      - name: env_json
        type: String
        description: >-
          JSON object of env vars the mitigation container needs, e.g.
          {"TARGET_HOST": "...", "TARGET_PORT": "3306"} or {"REDIS_HOST": "...", "REDIS_PORT": "6379"}.
          Decoded by the container's mitigation-entrypoint.sh wrapper into real exported env vars
          before the real check script runs - this is what makes the template genuinely
          mitigation-agnostic (v1.0.8's TARGET_HOST/DB_USER-shaped variables were specific to one
          mitigation type; v2.0.0 replaced them with this opaque contract, see PLATSRE-1296).
          For a secret value (e.g. a DB password), do NOT embed <+secrets.getValue(...)> as a
          substring in this JSON - confirmed empirically that it resolves to the literal string
          "null" rather than the real value when nested inside a larger String-type variable this
          way (a distinct bug from v1.0.8's Secret-type-stage-variable issue, same underlying
          lesson: getValue() only resolves correctly as a variable's *entire* value). Instead, put
          the literal placeholder "__MITIGATION_SECRET__" at that key, e.g.
          {"DB_PASSWORD": "__MITIGATION_SECRET__"}, and set secret_identifier below - the wrapper
          substitutes it from the separately-resolved MITIGATION_SECRET_VALUE env var.
        required: true
        value: <+input>
      - name: secret_identifier
        type: String
        description: >-
          Identifier of a Harness secret to make available to the container as
          MITIGATION_SECRET_VALUE (resolved as this variable's whole value, the only way
          getValue() resolves correctly here - see env_json's description). Required even for
          mitigations with no real secret need - pass any existing, harmless secret identifier
          in that case (its value is simply never referenced, since env_json won't contain the
          "__MITIGATION_SECRET__" placeholder).
        required: true
        value: <+input>
