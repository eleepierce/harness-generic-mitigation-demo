template:
  name: run-generic-mitigation
  identifier: rungenericmitigation
  versionLabel: "2.1.0"
  type: Stage
  projectIdentifier: reliability_engineering
  orgIdentifier: cloudnativeplatform
  tags: {}
  spec:
    type: Custom
    spec:
      execution:
        steps:
          # --- Prod gate (PLATSRE-1653) -------------------------------------------------
          # Runs on the delegate (no container/k8s infra) BEFORE the mitigation step group,
          # so a blocked prod run fails here and the mitigation never executes. Mirrors SSM's
          # dev-vs-prod distinction: prod requires a linked ticket_id (Jira key pattern, and
          # optionally verified to exist via the Jira API); dev/stage pass straight through
          # with no ticket required.
          - step:
              type: ShellScript
              name: Prod Ticket Gate
              identifier: Prod_Ticket_Gate
              timeout: 2m
              spec:
                shell: Bash
                onDelegate: true
                source:
                  type: Inline
                  spec:
                    script: |
                      set -eu

                      ENVIRONMENT="$(printf '%s' "${ENVIRONMENT:-}" | tr '[:upper:]' '[:lower:]')"
                      TICKET_ID="${TICKET_ID:-}"

                      case "$ENVIRONMENT" in
                        prod|production|prd) IS_PROD=true ;;
                        *)                   IS_PROD=false ;;
                      esac

                      if [ "$IS_PROD" != "true" ]; then
                        echo "Environment '${ENVIRONMENT:-<unset>}' is non-prod - no ticket required, proceeding."
                        exit 0
                      fi

                      # --- Prod: a linked ticket ID is mandatory. -----------------------
                      if [ -z "$TICKET_ID" ]; then
                        echo "BLOCKED: prod runs require a ticket_id (linked incident/Jira key). None provided." >&2
                        exit 1
                      fi

                      # Must look like a Jira issue key: PROJECT-123 (uppercase project, digits).
                      if ! printf '%s' "$TICKET_ID" | grep -Eq '^[A-Z][A-Z0-9]+-[0-9]+$'; then
                        echo "BLOCKED: ticket_id '${TICKET_ID}' is not a valid Jira issue key (expected e.g. PLATSRE-1653)." >&2
                        exit 1
                      fi
                      echo "ticket_id '${TICKET_ID}' matches the Jira issue-key pattern."

                      # --- Optional: verify the ticket actually exists via the Jira API. -
                      # Activates only when the delegate has both JIRA_BASE_URL and JIRA_TOKEN
                      # in its environment (no Harness secret plumbing, so nothing to resolve
                      # or fail on where it's not configured). Definitive 404 -> block; a
                      # transport/5xx error falls back to pattern-only rather than blocking a
                      # legitimate prod mitigation when Jira is unreachable.
                      if [ -n "${JIRA_BASE_URL:-}" ] && [ -n "${JIRA_TOKEN:-}" ]; then
                        if ! command -v curl >/dev/null 2>&1; then
                          echo "Jira API verification requested but curl is unavailable - pattern check only."
                        else
                          URL="${JIRA_BASE_URL%/}/rest/api/2/issue/${TICKET_ID}?fields=key"
                          CODE="$(curl -sS -o /dev/null -w '%{http_code}' \
                            -H "Authorization: Bearer ${JIRA_TOKEN}" \
                            -H "Accept: application/json" \
                            --max-time 10 "$URL")" || CODE="000"
                          case "$CODE" in
                            200)
                              echo "Jira API confirms ${TICKET_ID} exists (HTTP 200)."
                              ;;
                            404)
                              echo "BLOCKED: Jira API reports ${TICKET_ID} does not exist (HTTP 404)." >&2
                              exit 1
                              ;;
                            401|403)
                              echo "BLOCKED: Jira API rejected the credentials (HTTP ${CODE}) - cannot verify ${TICKET_ID}." >&2
                              exit 1
                              ;;
                            *)
                              echo "WARNING: Jira API check inconclusive (HTTP ${CODE}) - falling back to pattern-only for ${TICKET_ID}."
                              ;;
                          esac
                        fi
                      else
                        echo "Jira API verification skipped (JIRA_BASE_URL/JIRA_TOKEN not set on delegate) - pattern check only."
                      fi

                      echo "Prod gate passed for ${TICKET_ID}."
                environmentVariables:
                  - name: ENVIRONMENT
                    type: String
                    value: <+stage.variables.environment>
                  - name: TICKET_ID
                    type: String
                    value: <+stage.variables.ticket_id>
                outputVariables: []
          - stepGroup:
              name: mitigation
              identifier: mitigation
              steps:
                - step:
                    type: Run
                    name: Verify Image Signature
                    identifier: Verify_Image_Signature
                    timeout: 2m
                    spec:
                      connectorRef: <+stage.variables.verifier_connector>
                      image: <+stage.variables.verifier_image>
                      shell: Sh
                      command: |-
                        set -euo pipefail
                        echo "Verifying image signature: <+stage.variables.image_fully_qualified>"

                        # cosign reaches ECR with its OWN keychain, not the Harness connector.
                        # The verifier image ships docker-credential-ecr-login but never
                        # registers it, so cosign would authenticate anonymously and get 401.
                        # Register the helper for the image's registry host here; it then uses
                        # the delegate node role's ambient creds (IMDS) to fetch a token. Pull
                        # is authorized by the admin-verifier ecr_policy.json node-role grant.
                        REGISTRY_HOST=$(echo "<+stage.variables.image_fully_qualified>" | cut -d/ -f1)
                        export DOCKER_CONFIG=/tmp/.docker
                        mkdir -p "$DOCKER_CONFIG"
                        printf '{"credHelpers":{"%s":"ecr-login"}}' "$REGISTRY_HOST" > "$DOCKER_CONFIG/config.json"

                        cosign verify --insecure-ignore-tlog --key /usr/local/share/cosign-public.key <+stage.variables.image_fully_qualified>
                        echo "✓ Image signature verified successfully"
                - step:
                    type: Run
                    name: Verify Branch Attestation
                    identifier: Verify_Branch_Attestation
                    timeout: 2m
                    when:
                      stageStatus: Success
                      condition: <+stage.variables.environment> != "dev"
                    spec:
                      connectorRef: <+stage.variables.verifier_connector>
                      image: <+stage.variables.verifier_image>
                      shell: Sh
                      command: |-
                        set -euo pipefail
                        echo "Verifying branch attestation for: <+stage.variables.image_fully_qualified>"

                        # Register the ECR credential helper for cosign's keychain (see the
                        # Verify Image Signature step for why this is needed).
                        REGISTRY_HOST=$(echo "<+stage.variables.image_fully_qualified>" | cut -d/ -f1)
                        export DOCKER_CONFIG=/tmp/.docker
                        mkdir -p "$DOCKER_CONFIG"
                        printf '{"credHelpers":{"%s":"ecr-login"}}' "$REGISTRY_HOST" > "$DOCKER_CONFIG/config.json"

                        # Verify attestation and capture output
                        ATTESTATION_OUTPUT=$(cosign verify-attestation --insecure-ignore-tlog --type custom --key /usr/local/share/cosign-public.key <+stage.variables.image_fully_qualified>)

                        # Extract branch from attestation. .predicate.Data is a stringified
                        # JSON blob, so it must be re-parsed with a second jq (matches the
                        # production verifier.sh) -- indexing .predicate.Data.branch directly
                        # fails with "Cannot index string with string".
                        BRANCH=$(echo "$ATTESTATION_OUTPUT" | jq -r '.payload' | base64 -d | jq -r '.predicate.Data' | jq -r '.branch')

                        echo "Image was built from branch: $BRANCH"

                        # Enforce main branch in non-dev environments
                        if [ "$BRANCH" != "main" ]; then
                          echo "Error: Image was built from non-main branch '$BRANCH'"
                          echo "Non-main branch images can only be executed in dev environments"
                          exit 1
                        fi

                        echo "✓ Branch attestation verified: main"
                - step:
                    type: Run
                    name: Run Mitigation Container
                    identifier: Run_Mitigation_Container
                    timeout: 5m
                    spec:
                      connectorRef: <+stage.variables.docker_connector>
                      image: <+stage.variables.image>
                      shell: Sh
                      # No command: the step runs the image's ENTRYPOINT, which is the
                      # mitigation-entrypoint.sh wrapper. The wrapper decodes MITIGATION_ENV_JSON
                      # into real env vars and substitutes the secret placeholder before exec'ing
                      # the image's real check script -- this is what keeps the template
                      # mitigation-agnostic (see the env_json variable description). The image
                      # MUST carry that wrapper (v2.0.0-compatible); an image built before the
                      # wrapper was added exec's its check script directly and never sees the
                      # decoded vars (empirically: exit 127 "mitigation-entrypoint.sh: not found"
                      # / REDIS_HOST unset). Verified green end-to-end with redis-check:v2.0.0.
                      envVariables:
                        MITIGATION_ENV_JSON: <+stage.variables.env_json>
                        MITIGATION_SECRET_VALUE: <+secrets.getValue(<+stage.variables.secret_identifier>)>
              stepGroupInfra:
                type: KubernetesDirect
                spec:
                  connectorRef: <+stage.variables.k8s_connector>
                  namespace: default
    variables:
      - name: image
        type: String
        description: Image reference relative to docker_connector's registry (used by the Run Mitigation Container step, which resolves it by prepending the connector's own registry host)
        required: true
        value: <+input>
      - name: image_fully_qualified
        type: String
        description: The SAME image as 'image', but as a complete registry-qualified reference (e.g. 018537234677.dkr.ecr.us-east-1.amazonaws.com/github.com/twilio-internal/generic-mitigation-scripts/admin-verifier:1.4.2). Required separately because cosign has no concept of Harness connectors -- it parses this string directly as a standard OCI reference, so it needs the full host, not a connector-relative path.
        required: true
        value: <+input>
      - name: docker_connector
        type: String
        description: Identifier of the team's DockerRegistry connector for the mitigation image
        required: true
        value: <+input>
      - name: k8s_connector
        type: String
        description: Identifier of the team's K8sCluster connector (their delegate/cluster)
        required: true
        value: <+input>
      - name: env_json
        type: String
        description: "JSON object of env vars the mitigation container needs, e.g. {\"TARGET_HOST\": \"...\", \"TARGET_PORT\": \"3306\"} or {\"REDIS_HOST\": \"...\", \"REDIS_PORT\": \"6379\"}. Decoded by the container's mitigation-entrypoint.sh wrapper into real exported env vars before the real check script runs - this is what makes the template genuinely mitigation-agnostic (v1.0.8's TARGET_HOST/DB_USER-shaped variables were specific to one mitigation type; v2.0.0 replaced them with this opaque contract, see PLATSRE-1296). For a secret value (e.g. a DB password), do NOT embed <+secrets.getValue(...)> as a substring in this JSON - confirmed empirically that it resolves to the literal string \"null\" rather than the real value when nested inside a larger String-type variable this way (a distinct bug from v1.0.8's Secret-type-stage-variable issue, same underlying lesson: getValue() only resolves correctly as a variable's *entire* value). Instead, put the literal placeholder \"__MITIGATION_SECRET__\" at that key, e.g. {\"DB_PASSWORD\": \"__MITIGATION_SECRET__\"}, and set secret_identifier below - the wrapper substitutes it from the separately-resolved MITIGATION_SECRET_VALUE env var."
        required: true
        value: <+input>
      - name: secret_identifier
        type: String
        description: Identifier of a Harness secret to make available to the container as MITIGATION_SECRET_VALUE (resolved as this variable's whole value, the only way getValue() resolves correctly here - see env_json's description). Required even for mitigations with no real secret need - pass any existing, harmless secret identifier in that case (its value is simply never referenced, since env_json won't contain the "__MITIGATION_SECRET__" placeholder).
        required: true
        value: <+input>
      - name: verifier_image
        type: String
        description: Container image used for signature verification. Must contain cosign, jq, and the trusted KMS public key baked in at /usr/local/share/cosign-public.key (the path the verify steps pass to cosign --key). The production admin-verifier image satisfies this - see generic-mitigation-scripts verifier.sh, which uses the same file. Passing the key via an env var was dropped in favour of the baked-in file because multi-line PEM values are mangled in transit through Harness String variables (PEM decoding failed).
        required: true
        value: <+input>
      - name: verifier_connector
        type: String
        description: Identifier of the DockerRegistry connector for pulling the verifier image. Kept separate from docker_connector to decouple verification from team-supplied mitigation images.
        required: true
        value: <+input>
      - name: environment
        type: String
        description: >-
          Target environment for this run (dev/stage/prod), sourced from the domain
          manifest's topology.environments key by the fan-out orchestrator. Drives two
          gates: (1) the Branch Attestation step is skipped when environment='dev' and
          enforces main-branch images otherwise; (2) the Prod Ticket Gate step (PLATSRE-1653)
          requires a valid ticket_id below when environment='prod'.
        required: true
        value: <+input>.allowedValues(dev,stage,prod)
      - name: ticket_id
        type: String
        description: >-
          Linked incident/Jira ticket key justifying a prod mitigation, e.g. PLATSRE-1653.
          Required (and validated against the Jira issue-key pattern, optionally verified via
          the Jira API) only when environment=prod - dev/stage runs may leave it empty. This
          asymmetric requirement is enforced at runtime by the Prod Ticket Gate step rather
          than by the schema, so non-prod runs are never prompted for it.
        required: false
        value: <+input>.default("")
